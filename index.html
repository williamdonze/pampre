<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Pampre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<style>
/* Mise en page : appli mobile centrée (colonne 680px), barre haute de stats, barre d'onglets en bas,
   parcours en zigzag façon Duolingo ; sessions plein écran avec feuille de correction qui monte du bas. */
:root{
  --bg:#FBF5EC;
  --paper:#FFFFFF;
  --ink:#2A161C;
  --muted:#7A6469;
  --line:#EBDDD0;
  --grape:#8B1E3F;
  --grape-deep:#5E0F28;
  --grape-soft:#F6E2E7;
  --gold:#E3A41D;
  --gold-deep:#A87308;
  --gold-soft:#FBEFD2;
  --leaf:#58A700;
  --leaf-deep:#3F7A00;
  --leaf-soft:#E5F5D3;
  --bad:#E0473E;
  --bad-deep:#A82A22;
  --bad-soft:#FDE3E1;
  /* texte des corrections (juste / faux), lisible sur les fonds -soft */
  --leaf-ink:#3F7A00;
  --bad-ink:#A82A22;
  --plum:#6B4FA0;
  --plum-soft:#ECE5F7;
  --locked:#D9CDC3;
  --locked-deep:#B5A69A;
  --sea:#DCEBF2;
  --land:#FFFDF8;
  --shadow:0 1px 0 rgba(42,22,28,.04),0 6px 20px rgba(42,22,28,.06);
  --f-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  /* papier des étiquettes : objets physiques, identiques dans les deux thèmes */
  --lbl-creme:#F7EEDC; --lbl-vert:#E6EDE1; --lbl-noir:#1E1A1B; --lbl-or:#F1DFA8; --lbl-bordeaux:#5A1426; --lbl-rose:#F7DED9;
  --lbl-ink:#2A1C14; --lbl-ink-clair:#F4E7C8; --lbl-dore:#B8862A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1013; --paper:#251A1E; --ink:#F6EAE6; --muted:#B8A2A7; --line:#3A2A30;
    --grape:#D24A73; --grape-deep:#8E2448; --grape-soft:#3A1B26;
    --gold:#F0B83A; --gold-deep:#B07C0E; --gold-soft:#3A2E14;
    --leaf:#79C82A; --leaf-deep:#4F8A12; --leaf-soft:#1F3014;
    --bad:#F06A60; --bad-deep:#A9372F; --bad-soft:#3C1A18; --leaf-ink:#8FD44F; --bad-ink:#FF8F86;
    --plum:#A991D6; --plum-soft:#2C2340;
    --locked:#3E3237; --locked-deep:#2B2226;
    --sea:#15232B; --land:#2A2024;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1013; --paper:#251A1E; --ink:#F6EAE6; --muted:#B8A2A7; --line:#3A2A30;
  --grape:#D24A73; --grape-deep:#8E2448; --grape-soft:#3A1B26;
  --gold:#F0B83A; --gold-deep:#B07C0E; --gold-soft:#3A2E14;
  --leaf:#79C82A; --leaf-deep:#4F8A12; --leaf-soft:#1F3014;
  --bad:#F06A60; --bad-deep:#A9372F; --bad-soft:#3C1A18; --leaf-ink:#8FD44F; --bad-ink:#FF8F86;
  --plum:#A991D6; --plum-soft:#2C2340;
  --locked:#3E3237; --locked-deep:#2B2226;
  --sea:#15232B; --land:#2A2024;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px}

/* ---------- barre du haut ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--grape);background:none;border:0;padding:0;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.stats{margin-left:auto;display:flex;gap:6px;align-items:center}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-size:15px;padding:4px 8px;border-radius:12px;font-variant-numeric:tabular-nums;background:none;border:0}
.stat svg{width:22px;height:22px}
.stat.flame{color:#E8730C}
.stat.flame.off{color:var(--muted);filter:grayscale(1);opacity:.7}
.stat.xp{color:var(--gold-deep)}
.rank-chip{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--grape);background:var(--grape-soft);padding:4px 9px;border-radius:999px;white-space:nowrap}
@media (max-width:420px){.rank-chip{display:none}}

/* ---------- onglets du bas ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;height:64px;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent;background:none;border-radius:14px;padding:6px 2px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--grape);background:var(--grape-soft);border-color:color-mix(in srgb,var(--grape) 30%,transparent)}
main{padding-block:20px 110px}

/* ---------- boutons « 3D » ---------- */
.btn{--c:var(--grape);--d:var(--grape-deep);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:16px;border:0;background:var(--c);color:#fff;font-weight:800;font-size:16px;letter-spacing:.03em;text-transform:uppercase;box-shadow:0 4px 0 var(--d);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--d)}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:disabled,.btn.leaf:disabled,.btn.gold:disabled,.btn.bad:disabled{--c:var(--locked);--d:var(--locked-deep);color:var(--muted);cursor:not-allowed}
.btn.gold{--c:var(--gold);--d:var(--gold-deep);color:#3a2600}
.btn.leaf{--c:var(--leaf);--d:var(--leaf-deep)}
.btn.bad{--c:var(--bad);--d:var(--bad-deep)}
.btn.ghost{--c:var(--paper);--d:var(--line);color:var(--grape);border:2px solid var(--line)}
.btn.block{width:100%}
.btn.small{min-height:38px;padding:6px 14px;font-size:13px;border-radius:12px}
.linkbtn{background:none;border:0;color:var(--grape);font-weight:800;padding:4px;text-decoration:underline;text-underline-offset:3px}

/* ---------- cartes génériques ---------- */
.panel{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:18px}
.eyebrow{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* ---------- accueil ---------- */
.home-hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:18px}
.home-hero .mascot{width:84px;height:84px}
.bubble{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:700}
.bubble::before{content:"";position:absolute;left:-10px;top:24px;width:16px;height:16px;background:var(--paper);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.daily{display:flex;gap:14px;align-items:center;margin-bottom:28px}
.daily .ico{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold-deep)}
.daily .ico svg{width:32px;height:32px}
.daily .txt{flex:1;min-width:0}
.daily h3{font-size:19px}
.daily p{color:var(--muted);font-size:14px}
.daily.done .ico{background:var(--leaf-soft);color:var(--leaf-deep)}

.unit{margin-bottom:36px}
.unit-head{--u:var(--grape);--ud:var(--grape-deep);background:var(--u);color:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 4px 0 var(--ud);display:flex;gap:12px;align-items:center}
.unit-head .num{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.unit-head h2{font-size:24px;color:#fff}
.unit-head p{font-size:14px;opacity:.92}
.unit-head .uico{margin-left:auto;flex:none;width:54px;height:54px;opacity:.95}
.unit.locked .unit-head{--u:var(--locked);--ud:var(--locked-deep);color:var(--muted)}
.unit.locked .unit-head h2{color:var(--muted)}
.unit-note{text-align:center;color:var(--muted);font-weight:700;font-size:14px;padding:18px 8px 0}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:56px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{--c:var(--grape);--d:var(--grape-deep);width:76px;height:70px;border-radius:50%;border:0;background:var(--c);color:#fff;box-shadow:0 7px 0 var(--d);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.node svg{width:38px;height:38px}
.node:active:not(:disabled){transform:translateY(6px);box-shadow:0 1px 0 var(--d)}
.node.done{--c:var(--gold);--d:var(--gold-deep);color:#3a2600}
.node.locked{--c:var(--locked);--d:var(--locked-deep);color:var(--muted);cursor:not-allowed}
.node.quiz{width:88px;height:80px}
.node.quiz.current,.node.quiz.done{border-radius:28px}
.node-label{margin-top:12px;font-weight:800;font-size:14px;text-align:center;max-width:150px;line-height:1.25}
.node-wrap.locked .node-label{color:var(--muted)}
.ring{position:absolute;top:-8px;width:92px;height:92px;pointer-events:none}
.node-wrap .start{position:absolute;top:-44px;background:var(--paper);color:var(--grape);border:2px solid var(--line);border-radius:12px;padding:4px 12px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.node-wrap .start::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--paper);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
.node-wrap.has-start{margin-top:32px} /* place réservée à la bulle, qui sinon recouvre le libellé du nœud précédent */
.bonus-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.bonus{padding:14px;border-radius:16px;border:2px dashed var(--line);color:var(--muted)}
.bonus b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px}
.bonus span{font-size:13px}

/* ---------- session (leçon / jeu / quiz) ---------- */
.session{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.s-top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.iconbtn{width:42px;height:42px;border-radius:12px;border:0;background:none;color:var(--muted);display:grid;place-items:center;flex:none}
.iconbtn svg{width:26px;height:26px}
.iconbtn:hover{background:var(--grape-soft);color:var(--grape)}
.pbar{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--leaf);border-radius:999px;transition:width .4s cubic-bezier(.3,1.4,.5,1);box-shadow:inset 0 -5px 0 rgba(0,0,0,.08),inset 0 4px 0 rgba(255,255,255,.25)}
.s-count{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;min-width:42px;text-align:right}
.s-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.s-body .wrap{padding-block:12px 28px}
.s-foot{border-top:2px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.s-foot .wrap{display:flex;gap:12px;padding-block:14px}
.s-foot .btn{flex:1}
.s-foot .btn.ghost{flex:0 0 auto}

.qtitle{font-size:24px;margin-bottom:18px}
.qkind{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--plum);margin-bottom:6px}

/* carte de leçon */
.lcard{animation:slidein .35s ease}
@keyframes slidein{from{opacity:.4;transform:translateX(18px)}to{opacity:1;transform:none}}
.lcard .illu{background:var(--grape-soft);border-radius:22px;padding:14px;display:grid;place-items:center;margin-bottom:18px}
.lcard .illu svg{width:100%;max-width:300px;height:auto}
.lcard h2{font-size:27px;margin-bottom:12px}
.rich p{margin-bottom:12px;max-width:62ch}
.rich strong{font-weight:800;color:var(--grape)}
.gl{background:none;border:0;padding:0;font:inherit;font-weight:700;color:inherit;text-decoration:underline dotted;text-decoration-color:var(--grape);text-decoration-thickness:2px;text-underline-offset:4px;cursor:help}
.gl:hover{color:var(--grape)}
.aside{display:flex;gap:12px;border-radius:16px;padding:12px 14px;margin-top:14px;font-size:15px}
.aside svg{flex:none;width:26px;height:26px;margin-top:2px}
.aside b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.aside.ex{background:var(--paper);border:2px solid var(--line)}
.aside.ex b{color:var(--grape)}
.aside.tip{background:var(--gold-soft);color:var(--ink)}
.aside.tip b{color:var(--gold-deep)}
.aside.deb{background:var(--plum-soft)}
.aside.deb b{color:var(--plum)}
.aside .vin{font-family:var(--f-label);font-size:19px;font-weight:700;line-height:1.2;display:block;margin:2px 0}

/* choix */
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--paper);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px;font-weight:700;font-size:16px;transition:background .12s,border-color .12s,transform .08s}
.choice:active{transform:translateY(2px)}
.choice .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--grape);background:var(--grape-soft);color:var(--grape)}
.choice[aria-pressed="true"] .k{border-color:var(--grape);color:var(--grape)}
.choice.ok{border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf-ink)}
.choice.ko{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink)}
.choice:disabled{cursor:default}
.vf{grid-template-columns:1fr 1fr}
.vf .choice{justify-content:center;font-size:20px;padding:22px 10px;font-family:var(--f-display)}

/* remise en ordre */
.slots{min-height:64px;border:2px dashed var(--line);border-radius:16px;padding:8px;display:grid;gap:8px;margin-bottom:16px}
.slots:empty::before{content:"Touche les étapes dans le bon ordre";color:var(--muted);font-weight:700;font-size:14px;display:grid;place-items:center;min-height:44px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--paper);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px 12px;font-weight:700;font-size:15px;text-align:left;touch-action:none;user-select:none}
.chip.used{visibility:hidden}
.chip.picked{border-color:var(--grape);background:var(--grape-soft);color:var(--grape)}
.slots .chip{display:flex;gap:10px;align-items:center;width:100%}
.slots .chip .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--grape);color:#fff;font-size:13px;display:grid;place-items:center}
.chip.ok{border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf-ink)}
.chip.ko{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink)}

/* association */
.assoc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.assoc .col{display:grid;gap:10px;align-content:start;min-width:0}
.assoc .chip{width:100%;min-height:56px;text-align:center;display:grid;place-items:center;font-size:14px}
.assoc .chip[data-pair]{color:#fff;border-color:transparent}

/* tri */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.cat{border:2px dashed var(--line);border-radius:16px;padding:8px;min-height:96px;display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--paper) 60%,transparent);transition:border-color .15s,background .15s}
.cat>b{font-family:var(--f-display);font-size:16px;text-align:center;color:var(--grape)}
.cat.hot{border-color:var(--grape);background:var(--grape-soft)}
.cat .chip{font-size:13px;padding:6px 8px}
.drag-ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg);box-shadow:0 10px 24px rgba(0,0,0,.2)}

/* indices */
.clues{display:grid;gap:10px;margin-bottom:16px}
.clue{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:700;animation:slidein .3s ease}
.clue .n{flex:none;font-family:var(--f-display);font-size:13px;color:#fff;background:var(--plum);border-radius:8px;padding:1px 8px}
.clue-pts{font-weight:800;color:var(--gold-deep);font-size:14px;margin-bottom:10px}

/* feuille de correction */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:45;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet.ok{background:var(--leaf-soft)}
.sheet.ko{background:var(--bad-soft)}
.sheet .wrap{padding-block:18px 16px;display:grid;gap:12px}
.sheet h3{font-size:24px;display:flex;align-items:center;gap:10px}
.sheet.ok h3{color:var(--leaf-ink)}
.sheet.ko h3{color:var(--bad-ink)}
.sheet h3 svg{width:32px;height:32px}
.sheet .expl{font-size:15px;max-height:32vh;overflow-y:auto}
.sheet .expl b{font-weight:800}
.sheet .answer{font-weight:800;color:var(--bad-ink)}

/* fin de session */
.endcard{text-align:center;padding-top:20px;display:grid;gap:16px;justify-items:center}
.endcard h2{font-size:32px}
.endcard .mascot{width:120px;height:120px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4)}to{transform:none}}
.end-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.es{border:2px solid var(--c,var(--gold));border-radius:16px;overflow:hidden}
.es b{display:block;background:var(--c,var(--gold));color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:4px}
.es span{display:block;font-family:var(--f-display);font-size:24px;font-weight:800;padding:8px 4px;color:var(--c,var(--gold-deep));font-variant-numeric:tabular-nums}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- étiquettes ---------- */
.lbl-stage{display:grid;place-items:center;padding:8px 0 18px}
.lbl{--p:var(--lbl-creme);--i:var(--lbl-ink);--a:var(--lbl-dore);background:var(--p);color:var(--i);font-family:var(--f-label);width:100%;max-width:330px;border-radius:6px;padding:18px 18px 12px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;box-shadow:0 2px 0 rgba(0,0,0,.06),0 12px 28px rgba(60,30,20,.18);position:relative;outline:1px solid color-mix(in srgb,var(--a) 50%,transparent);outline-offset:-8px}
.lbl.t-vert{--p:var(--lbl-vert)}
.lbl.t-noir{--p:var(--lbl-noir);--i:var(--lbl-ink-clair)}
.lbl.t-or{--p:var(--lbl-or)}
.lbl.t-bordeaux{--p:var(--lbl-bordeaux);--i:var(--lbl-ink-clair)}

/* ---------------- sauvegarde ---------------- */
function freshState(){
  return { v:1, xp:0, streak:{count:0,last:null}, days:{}, done:{}, quiz:{}, games:{}, badges:{}, mistakes:[], daily:{}, map:{games:0, best:{}, regions:{}}, gloss:{}, theme:null };
}
// Répare une sauvegarde abîmée, d'une ancienne version ou mal importée : chaque champ retrouve le type attendu.
function normaliser(o){
  const s = freshState();
  const obj = v => !!v && typeof v === "object" && !Array.isArray(v);
  const num = (v, d) => Number.isFinite(v) ? v : d;
  if (!obj(o)) return s;
  s.xp = Math.max(0, num(o.xp, 0));
  if (obj(o.streak)) s.streak = { count:Math.max(0, num(o.streak.count, 0)), last:typeof o.streak.last === "string" ? o.streak.last : null };
  for (const k of ["days", "done", "games", "badges", "daily", "gloss"]) if (obj(o[k])) s[k] = o[k];
  if (obj(o.quiz)) s.quiz = Object.fromEntries(Object.entries(o.quiz).filter(([, q]) => obj(q)));
  if (Array.isArray(o.mistakes)) s.mistakes = o.mistakes.filter(x => typeof x === "string").slice(-60);
  if (obj(o.map)) s.map = { ...o.map, games:num(o.map.games, 0), best:obj(o.map.best) ? o.map.best : {}, regions:obj(o.map.regions) ? o.map.regions : {} };
  if (o.theme === "light" || o.theme === "dark") s.theme = o.theme;
  return s;
}
function loadState(){
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) return normaliser(JSON.parse(raw)); } catch(e) {}
  return freshState();
}
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(ST)); } catch(e) {} }

/* ---------------- progression ---------------- */
function rankOf(xp){ const r = D.niveaux.rangs; let cur = r[0], next = null; for (let i = 0; i < r.length; i++) { if (xp >= r[i].xp) { cur = r[i]; next = r[i+1] || null; } } return {cur, next}; }
function streakNow(){ const s = ST.streak; if (!s.last) return 0; const d = dayDiff(s.last, todayStr()); return d <= 1 ? s.count : 0; }
function gainXP(n, why){
  if (n <= 0) return;
  const before = rankOf(ST.xp).cur;
  ST.xp += n;
  const t = todayStr();
  ST.days[t] = (ST.days[t] || 0) + n;
  const s = ST.streak;
  if (s.last !== t) { s.count = (s.last && dayDiff(s.last, t) === 1) ? s.count + 1 : 1; s.last = t; if (s.count > 1) toast(I.flame, `Série de ${s.count} jours !`, "Reviens demain pour la prolonger."); }
  const after = rankOf(ST.xp).cur;
  if (after.nom !== before.nom) toast(I.star, `Nouveau rang : ${after.nom}`, `${fmt(ST.xp)} XP au compteur.`);

function award(id){

  if (Object.keys(ST.done).some(k => !k.startsWith("jeu:"))) award("premier-verre");

let GL_INDEX = {};

    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, t, d) => `<button type="button" class="gl" data-term="${t}">${d || t}</button>`)
    .replace(/\n/g, "<br>")}</p>`).join("");
}
function findTerm(t){ return GL_INDEX[t.toLowerCase()] || null; }

function openGlossary(focus){
  const terms = D.glossaire.termes;
  const keys = Object.keys(terms).sort((a,b) => a.localeCompare(b, "fr", {sensitivity:"base"}));
  const fkey = focus ? findTerm(focus) : null;
  if (fkey) { ST.gloss[fkey] = 1; checkBadges(); save(); }
  const bg = h(`<div class="drawer-bg"></div>`);
  const dr = h(`<aside class="drawer" role="dialog" aria-modal="true" aria-label="Glossaire">

  const list = dr.querySelector("#gl-list");
  const draw = q => {
    const nq = q.trim().toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu, "");
    const shown = keys.filter(k => !nq || (k + " " + terms[k].def).toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu,"").includes(nq));
    list.innerHTML = shown.length ? shown.map(k => `<div class="term ${k===fkey&&!q?"focus":""}" id="t-${esc(k).replace(/\s/g,"_")}"><span class="term-lv">Niveau ${terms[k].niveau||1}</span><h3>${esc(k)}</h3><p>${esc(terms[k].def)}</p>${terms[k].voir?`<p class="see">Voir aussi : ${terms[k].voir.map(v=>`<button class="gl" data-term="${esc(v)}">${esc(v)}</button>`).join(", ")}</p>`:""}</div>`).join("")
      : `<p style="color:var(--muted);padding:20px 0">Aucun mot trouvé. Essaie une autre orthographe.</p>`;
  };
  draw("");
  const close = () => { bg.remove(); dr.remove(); };
  bg.onclick = close; dr.querySelector("[data-close]").onclick = close;
  dr.querySelector("#gl-search").oninput = e => draw(e.target.value);
  dr.addEventListener("click", e => { const g = e.target.closest(".gl"); if (g) { e.stopPropagation(); const k = findTerm(g.dataset.term); if (k) { ST.gloss[k] = 1; save(); dr.querySelector("#gl-search").value = ""; draw(""); const el = list.querySelector(`#t-${CSS.escape(k.replace(/\s/g,"_"))}`); list.querySelectorAll(".focus").forEach(x=>x.classList.remove("focus")); if (el) { el.classList.add("focus"); el.scrollIntoView({block:"center", behavior:"smooth"}); } } } });
  document.body.append(bg, dr);
  if (fkey) requestAnimationFrame(() => list.querySelector(".focus")?.scrollIntoView({block:"center"}));
  else dr.querySelector("#gl-search").focus();
  document.addEventListener("keydown", function esc_(e){ if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc_); } });
}

/* ---------------- carte (SVG maison, sans tuiles) ---------------- */

const FRANCE_VB = { x:-560, y:-500, w:1100, h:1100 };

function MapView(host, opts = {}){
  const F = D.carteFrance;
  const depRegion = {};
  D.carteVins.regions.forEach(r => r.deps.forEach(d => { if (!depRegion[d]) depRegion[d] = r.id; }));
  let vb = {...FRANCE_VB};
  const box = h(`<div class="map-box">
    <svg viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" role="img" aria-label="Carte de France des vignobles">
      <g class="g-deps">${Object.entries(F.deps).map(([c, d]) => `<path class="dep" data-dep="${c}" d="${d.d}"/>`).join("")}</g>

    </svg>

    <div class="map-hint">Glisse pour déplacer · pince ou molette pour zoomer</div></div>`);

function scoreMap(entry, guess, map){
  const palier = D.carteVins.paliers.find(p => p.id === entry.palier);

    const reg = D.carteVins.regions.find(r => r.id === entry.region);
    inside = map.inRegion(guess, entry.region);
    const dAnch = Math.min(...reg.ancres.map(a => km(a, guess)));
    d = Math.min(d, dAnch);
    if (inside) d = 0;
  }
  const eff = Math.max(0, d - palier.plein);
  return { d, inside, score: Math.round(5000 * Math.exp(-eff / palier.echelleKm)) };
}

const PAIR_COLORS = ["#8B1E3F","#6B4FA0","#2E7D8C","#C77A12","#3F7A00","#B5475E"];
Q.assoc = (q, onChange) => {

Q.tri = (q, onChange) => {

  window.addEventListener("pointerup", onUp = e => { if (!drag) return; const d = drag; drag = null; if (d.ghost) { d.ghost.remove(); el.querySelectorAll(".cat").forEach(c => c.classList.remove("hot")); const cat = document.elementFromPoint(e.clientX, e.clientY)?.closest(".cat"); if (cat && el.contains(cat)) drop(d.k, +cat.dataset.cat); else { d.src.style.opacity = ""; } } else tap(d.k); });

    cleanup(){ window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp); },
    check(){ locked = true; let ok = true; el.querySelectorAll(".cat .chip").forEach(b => { const it = items[+b.dataset.it]; const good = place[+b.dataset.it] === it.c; if (!good) { ok = false; b.textContent = `${it.t} → ${q.categories[it.c]}`; } b.classList.add(good ? "ok" : "ko"); }); return { ok, answer: q.categories.map((c, k) => `${c} : ${q.items.filter(x => x[1] === k).map(x => x[0]).join(", ")}`).join(" · ") }; } };

/* ---------------- runner de session ---------------- */
/* steps : [{kind:"carte", carte}, {kind:"q", q}] ; opts : {title, mode, requeue, onEnd(result)} */
function runSession(steps, opts){
  closeSession();
  const ses = h(`<div class="session" role="dialog" aria-modal="true" aria-label="${esc(opts.title)}">
    <div class="s-top"><div class="wrap"><button class="iconbtn" data-quit aria-label="Quitter">${I.x}</button><div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></div><span class="s-count"></span></div></div>
    <div class="s-body"><div class="wrap" id="s-main"></div></div>
    <div class="s-foot"><div class="wrap"></div></div></div>`);
  document.body.appendChild(ses); document.body.style.overflow = "hidden";
  const main = ses.querySelector("#s-main"), foot = ses.querySelector(".s-foot .wrap"), bar = ses.querySelector(".pbar i"), count = ses.querySelector(".s-count");
  const queue = steps.slice(); const total = steps.length;
  let idx = 0, answered = 0, correct = 0, bonus = 0, current = null, sheet = null, sheetObs = null, retried = new Set(), results = [];
  const qTotal = steps.filter(s => s.kind === "q").length;

  ses.querySelector("[data-quit]").onclick = () => confirmBox("Quitter la session ?", "Ce que tu as fait dans cette session ne sera pas enregistré.", "Quitter", () => { closeSession(); render(); });

  function progress(){ const p = Math.min(1, idx / Math.max(total, queue.length)); bar.style.width = (p * 100) + "%"; count.textContent = qTotal ? `${Math.min(answered, qTotal)}/${qTotal}` : ""; }
  function show(){
    current?.cleanup?.(); sheet?.remove(); sheet = null; sheetObs?.disconnect(); sheetObs = null; ses.querySelector(".s-body").style.paddingBottom = "";
    if (idx >= queue.length) return finish();
    progress();
    const st = queue[idx];
    main.innerHTML = ""; ses.querySelector(".s-body").scrollTop = 0;
    if (st.kind === "carte") {
      const c = st.carte;
      main.appendChild(h(`<article class="lcard"><div class="illu">${illu(c.illu)}</div><h2>${esc(c.titre)}</h2><div class="rich">${rich(c.texte)}</div>
        ${c.exemple?`<div class="aside ex">${I.bottle.replace("<svg",'<svg style="color:var(--grape)"')}<div><b>Exemple</b><span class="vin">${esc(c.exemple.vin)}</span>${esc(c.exemple.detail)}</div></div>`:""}
        ${c.astuce?`<div class="aside tip">${I.bulb.replace("<svg",'<svg style="color:var(--gold-deep)"')}<div><b>Bon à savoir</b><div class="rich">${rich(c.astuce)}</div></div></div>`:""}
        ${c.debat?`<div class="aside deb">${I.scale.replace("<svg",'<svg style="color:var(--plum)"')}<div><b>Débat d'experts</b><div class="rich">${rich(c.debat)}</div></div></div>`:""}</article>`));
      foot.innerHTML = `${idx > 0 && queue[idx-1].kind === "carte" ? `<button class="btn ghost" data-prev aria-label="Carte précédente">←</button>` : ""}<button class="btn" data-next>Continuer</button>`;
      foot.querySelector("[data-next]").onclick = () => { idx++; show(); };
      foot.querySelector("[data-prev]")?.addEventListener("click", () => { idx--; show(); });
      current = null; foot.querySelector("[data-next]").focus({preventScroll:true});
      return;
    }
    const q = st.q;
    const kindName = { qcm:"Choix multiple", vf:"Vrai ou faux", ordre:"Remets dans l'ordre", assoc:"Associe", tri:"Classe", etiquette:"Lis l'étiquette", indices:"À l'aveugle", carte:"Sur la carte" }[q.type] || "";
    const box = h(`<div><div class="qkind">${kindName}${st.retry ? " · nouvelle chance" : ""}</div><h2 class="qtitle">${esc(q.question)}</h2></div>`);
    main.appendChild(box);
    foot.innerHTML = `<button class="btn leaf" data-check disabled>Vérifier</button>`;
    const btn = foot.querySelector("[data-check]");
    current = Q[q.type](q, () => { btn.disabled = !current.ready(); });
    box.appendChild(current.el);
    btn.onclick = () => verify(q, st);
  }
  function verify(q, st){
    const r = current.check(); answered++;
    if (r.ok) { correct += st.retry ? 0 : 1; bonus += r.bonus || 0; }
    results.push({ q, ok:r.ok, retry:!!st.retry, extra:r.extra });
    if (q.id && !q.id.startsWith("gen-") && !q.id.startsWith("map-")) { const i = ST.mistakes.indexOf(q.id); if (r.ok && i >= 0) ST.mistakes.splice(i, 1); if (!r.ok && i < 0) ST.mistakes.push(q.id); if (ST.mistakes.length > 60) ST.mistakes.shift(); save(); }
    if (!r.ok && opts.requeue && !retried.has(q)) { retried.add(q); queue.push({ kind:"q", q, retry:true }); }
    const good = ["Bien joué !","Excellent !","Parfait !","Santé !","Tu as le nez !","Bravo !"];
    sheet = h(`<div class="sheet ${r.ok?"ok":"ko"}"><div class="wrap"><h3>${r.ok?I.check:I.cross}${r.ok ? pick(good) : "Pas tout à fait"}</h3>
      <div class="expl">${!r.ok && r.answer ? `<p class="answer">Bonne réponse : ${esc(r.answer)}</p>` : ""}${r.ok && r.answer && q.type === "carte" ? `<p><b>${esc(r.answer)}</b></p>` : ""}${r.bonus ? `<p><b>+${r.bonus} point${r.bonus>1?"s":""} bonus d'indices</b></p>` : ""}${q.explication ? `<p>${esc(q.explication)}</p>` : ""}${q.type==="carte" ? `<p>${esc(D.carteVins.regions.find(x=>x.id===q.entry.region).fiche)}</p>` : ""}</div>
      <button class="btn ${r.ok?"leaf":"bad"} block" data-cont>Continuer</button></div></div>`);
    foot.innerHTML = ""; ses.appendChild(sheet);
    // la feuille recouvre le bas de la question : on réserve sa hauteur pour pouvoir tout faire défiler
    const body = ses.querySelector(".s-body"), reserve = () => { if (sheet) body.style.paddingBottom = sheet.offsetHeight + "px"; };
    reserve(); try { sheetObs = new ResizeObserver(reserve); sheetObs.observe(sheet); } catch(e) {}
    sheet.querySelector("[data-cont]").onclick = () => { idx++; show(); };
    sheet.querySelector("[data-cont]").focus({preventScroll:true});
  }
  function finish(){
    bar.style.width = "100%";
    count.textContent = qTotal ? `${qTotal}/${qTotal}` : "";
    current?.cleanup?.(); current = null;
    const res = { correct, total:qTotal, bonus, results };
    const out = opts.onEnd(res) || {};
    main.innerHTML = ""; foot.innerHTML = "";
    const pct = qTotal ? Math.round(correct / qTotal * 100) : 100;
    main.appendChild(h(`<div class="endcard">${mascot(out.mood || "happy")}<h2>${esc(out.title || "Session terminée !")}</h2>${out.text ? `<p style="max-width:44ch">${esc(out.text)}</p>` : ""}
      <div class="end-stats"><div class="es" style="--c:var(--gold)"><b>XP gagnés</b><span>+${out.xp || 0}</span></div><div class="es" style="--c:var(--leaf)"><b>Réussite</b><span>${qTotal ? pct + " %" : "100 %"}</span></div><div class="es" style="--c:var(--grape)"><b>${qTotal ? "Bonnes rép." : "Cartes"}</b><span>${qTotal ? `${correct}/${qTotal}` : total}</span></div></div></div>`));
    foot.innerHTML = `${out.retry ? `<button class="btn ghost" data-retry>Réessayer</button>` : ""}<button class="btn" data-done>Continuer</button>`;
    foot.querySelector("[data-done]").onclick = () => { closeSession(); render(); };
    foot.querySelector("[data-retry]")?.addEventListener("click", out.retry);
    if (out.confetti) confetti();
  }
  ses.addEventListener("keydown", e => {
    if (e.key === "Enter") { const b = (sheet && sheet.querySelector("[data-cont]")) || foot.querySelector("[data-next]:not(:disabled),[data-check]:not(:disabled),[data-done]"); if (b && document.activeElement?.tagName !== "BUTTON") { e.preventDefault(); b.click(); } }
    if (/^[1-4]$/.test(e.key) && current?.key && !sheet) current.key(+e.key - 1);
  });
  ses.tabIndex = -1; ses.focus();
  show();
}
function closeSession(){ document.querySelectorAll(".session,.sheet,.drag-ghost").forEach(x => x.remove()); document.body.style.overflow = ""; }

/* ---------------- lancement des activités ---------------- */
function findLesson(id){ for (const L of Object.values(LEVELS)) { const l = L.lecons.find(x => x.id === id); if (l) return { L, l }; } return null; }
function startStep(levelId, step){
  const L = LEVELS[levelId];
  if (step === "quiz") return startQuiz(levelId);
  if (step.startsWith("jeu:")) return startGame(levelId, step.slice(4));
  const { l } = findLesson(step);
  const steps = [...l.cartes.map(c => ({ kind:"carte", carte:c })), ...l.verif.map(q => ({ kind:"q", q }))];
  runSession(steps, { title:l.titre, requeue:true, onEnd:r => {
    const first = !ST.done[l.id]; ST.done[l.id] = todayStr();
    const xp = (first ? 15 : 5) + r.correct * 2; gainXP(xp);
    return { title:"Leçon terminée !", text: first ? `« ${l.titre} » est dans ta besace.` : "Révision faite, ça rentre !", xp };
  }});
}
function startGame(levelId, gid){
  const L = LEVELS[levelId]; const g = L.jeux.find(x => x.id === gid);
  const qs = g.generateur === "etiquettes" ? genLabelQuestions(g.tours || 10) : shuffle(g.questions);
  runSession(qs.map(q => ({ kind:"q", q })), { title:g.titre, onEnd:r => {
    const key = `jeu:${gid}`; const first = !ST.done[key]; ST.done[key] = todayStr();
    ST.games[gid] = Math.max(ST.games[gid] || 0, r.correct);
    const xp = r.correct * 3 + (first ? 15 : 5); gainXP(xp);
    if (g.badge && r.correct >= (g.seuilBadge ?? r.total)) award(g.badge);
    const great = r.correct >= Math.ceil(r.total * .8);
    return { title: great ? "Quel flair !" : "Partie terminée", text: great ? `${r.correct} sur ${r.total} : tu lis les vins comme un livre ouvert.` : `${r.correct} sur ${r.total}. Rejoue autant que tu veux, les questions changent.`, xp, retry:() => startGame(levelId, gid), mood: great ? "wow" : "happy" };
  }});
}
function startQuiz(levelId){
  const L = LEVELS[levelId]; const seuil = D.niveaux.seuilValidation;
  runSession(L.quiz.questions.map(q => ({ kind:"q", q })), { title:L.quiz.titre, onEnd:r => {
    const pct = r.correct / r.total; const pass = pct >= seuil;
    const prev = ST.quiz[levelId] || { best:0, passed:false };
    const firstPass = pass && !prev.passed;
    ST.quiz[levelId] = { best: Math.max(prev.best, Math.round(pct*100)), passed: prev.passed || pass };
    let xp = r.correct * 5 + r.bonus * 2 + (firstPass ? 40 : 0); gainXP(xp);
    if (pass) award(`niveau-${levelId}`); if (pct === 1) award("sans-faute");
    const next = D.niveaux.niveaux.find(n => n.id === levelId + 1);
    if (pass) return { title:"Niveau validé !", text: next ? `Bravo ! Le niveau ${next.id}, « ${next.titre} », est débloqué.` : "Tu as validé le dernier niveau !", xp, confetti:firstPass, mood:"wow" };
    return { title:"Presque !", text:`Il faut ${Math.round(seuil*100)} % pour valider. Revois les explications, puis retente ta chance : les leçons restent ouvertes.`, xp, retry:() => startQuiz(levelId), mood:"sad" };
  }});
}

/* ---------------- défi quotidien ---------------- */
function questionPool(){
  const pool = [];
  for (const [lid, L] of Object.entries(LEVELS)) {
    if (!levelUnlocked(+lid)) continue;
    L.lecons.forEach(l => { if (ST.done[l.id]) pool.push(...l.verif); });
    L.jeux.forEach(g => { if (ST.done[`jeu:${g.id}`] && g.questions) pool.push(...g.questions); });
    if (ST.quiz[lid]?.passed) pool.push(...L.quiz.questions);
  }
  return pool;
}
function buildDaily(){
  const t = todayStr(); const rnd = seeded("pampre-" + t);
  const byId = {}; for (const L of Object.values(LEVELS)) { L.lecons.forEach(l => l.verif.forEach(q => byId[q.id] = q)); L.jeux.forEach(g => (g.questions||[]).forEach(q => byId[q.id] = q)); L.quiz.questions.forEach(q => byId[q.id] = q); }
  const review = shuffle(ST.mistakes.filter(id => byId[id]), rnd).slice(0, 2).map(id => byId[id]);
  let pool = questionPool().filter(q => !review.includes(q));
  if (pool.length < 3) pool = pool.concat(LEVELS[1].lecons[0].verif, LEVELS[1].lecons[1].verif);
  const fresh = shuffle(pool, rnd).filter((q, i, a) => a.indexOf(q) === i).slice(0, 4 - review.length);
  const qs = [...review, ...fresh];
  const lbl = genLabelQuestions(1)[0];
  const ent = pick(D.carteVins.vins.filter(v => v.palier === 1), rnd);
  const mapQ = { type:"carte", id:`map-${ent.vin}`, question:"Où est produit ce vin ? Touche la carte.", entry:ent, explication:"" };
  return [...qs, lbl, mapQ];
}
function startDaily(){
  const t = todayStr();
  const qs = buildDaily();
  runSession(qs.map(q => ({ kind:"q", q })), { title:"Défi du jour", onEnd:r => {
    const first = !ST.daily[t]; ST.daily[t] = Math.max(ST.daily[t] || 0, r.correct);
    const xp = r.correct * 4 + (first ? 30 : 0); gainXP(xp); award("defi");
    return { title: first ? "Défi du jour relevé !" : "Défi rejoué", text: first ? "Bonus de 30 XP. Un nouveau défi t'attend demain." : "Le bonus quotidien est déjà empoché, mais l'entraînement compte.", xp, mood:"wow", confetti:first && r.correct === r.total };
  }});
}

/* ---------------- vue : profil ---------------- */
function viewProfil(){
  const el = h(`<main class="wrap"></main>`);
  const { cur, next } = rankOf(ST.xp);
  const pct = next ? Math.round((ST.xp - cur.xp) / (next.xp - cur.xp) * 100) : 100;
  const lessons = Object.keys(ST.done).filter(k => !k.startsWith("jeu:")).length;
  el.appendChild(h(`<div class="prof-head">${mascot("happy")}<div><div class="eyebrow">Ton rang</div><h1 style="font-size:30px">${esc(cur.nom)}</h1><p style="color:var(--muted)">${fmt(ST.xp)} XP au total</p></div></div>`));
  el.appendChild(h(`<div class="rankbar"><div class="row"><span>${esc(cur.nom)}</span><span style="color:var(--muted)">${next ? `${esc(next.nom)} à ${fmt(next.xp)} XP` : "Rang maximal"}</span></div><div class="meter"><i style="width:${pct}%"></i></div></div>`));
  el.appendChild(h(`<div class="kpis">
    <div class="kpi" style="color:#E8730C">${I.flame}<div><b style="color:var(--ink)">${streakNow()}</b><span>jours de série</span></div></div>
    <div class="kpi">${I.gem}<div><b>${fmt(ST.xp)}</b><span>XP</span></div></div>
    <div class="kpi" style="color:var(--grape)">${I.lesson}<div><b style="color:var(--ink)">${lessons}</b><span>leçons terminées</span></div></div>
    <div class="kpi" style="color:var(--leaf-deep)">${I.map}<div><b style="color:var(--ink)">${ST.map.games}</b><span>parties de carte</span></div></div>
    <div class="kpi" style="color:var(--gold-deep)">${I.trophy}<div><b style="color:var(--ink)">${Object.values(ST.quiz).filter(q => q.passed).length}/6</b><span>niveaux validés</span></div></div>
    <div class="kpi" style="color:var(--plum)">${I.book}<div><b style="color:var(--ink)">${Object.keys(ST.gloss).length}</b><span>mots consultés</span></div></div></div>`));
  const regFound = D.carteVins.regions.filter(r => ST.map.regions[r.id]).length;
  el.appendChild(h(`<div><h2 class="sec-title">Badges</h2><p style="color:var(--muted);font-size:14px">${Object.keys(ST.badges).length} sur ${D.niveaux.badges.length} · Tour de France : ${regFound}/13 régions trouvées</p></div>`));
  el.appendChild(h(`<div class="badges">${D.niveaux.badges.map(b => `<div class="badge ${ST.badges[b.id]?"":"off"}"><div class="bi">${ICON_BY_NAME[b.icone] || I.medal}</div><b>${esc(b.nom)}</b><span>${esc(b.desc)}</span></div>`).join("")}</div>`));

  const theme = h(`<div style="margin-bottom:26px"><h2 class="sec-title">Apparence</h2><div class="seg" role="group" aria-label="Thème">${[["auto","Auto"],["light","Clair"],["dark","Sombre"]].map(([k, n]) => `<button data-th="${k}" aria-pressed="${(ST.theme||"auto")===k}">${n}</button>`).join("")}</div></div>`);
  theme.onclick = e => { const b = e.target.closest("[data-th]"); if (!b) return; ST.theme = b.dataset.th === "auto" ? null : b.dataset.th; applyTheme(); save(); render(); };
  el.appendChild(theme);

  const sv = h(`<div class="panel"><h2 class="sec-title">Ta sauvegarde</h2><p style="font-size:14px;color:var(--muted)">Ta progression est enregistrée dans ce navigateur, sur cet appareil. Pour la transférer sur un autre appareil, copie ce code puis colle-le là-bas dans le champ ci-dessous.</p>
    <textarea class="save" id="save-out" readonly aria-label="Code de sauvegarde"></textarea>
    <div class="row-btns"><button class="btn small" data-a="copy">Copier le code</button></div>
    <label for="save-in" style="display:block;font-weight:800;margin-top:16px">Importer une sauvegarde</label>
    <textarea class="save" id="save-in" placeholder="Colle ici un code de sauvegarde"></textarea>
    <div class="row-btns"><button class="btn small ghost" data-a="import">Importer</button><button class="btn small bad" data-a="reset">Tout effacer</button></div><p id="save-msg" style="font-weight:700;margin-top:8px"></p></div>`);
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(ST))));
  sv.querySelector("#save-out").value = code;
  const msg = sv.querySelector("#save-msg");
  sv.addEventListener("click", e => {
    const a = e.target.closest("[data-a]")?.dataset.a;
    if (a === "copy") { const ta = sv.querySelector("#save-out"); navigator.clipboard?.writeText(code).then(() => { msg.textContent = "Code copié."; }, () => { ta.select(); msg.textContent = "Sélectionné : copie-le avec Ctrl+C ou un appui long."; }) ?? (ta.select(), msg.textContent = "Sélectionné : copie-le avec Ctrl+C."); }
    if (a === "import") { try { const raw = sv.querySelector("#save-in").value.trim(); const obj = JSON.parse(decodeURIComponent(escape(atob(raw)))); if (!obj || typeof obj.xp !== "number") throw 0; ST = normaliser(obj); save(); applyTheme(); render(); toast(I.check, "Sauvegarde importée", `${fmt(ST.xp)} XP récupérés.`); } catch(err) { msg.textContent = "Ce code n'est pas valide. Vérifie qu'il est complet, sans espace ajouté."; } }
    if (a === "reset") confirmBox("Tout effacer ?", "XP, série, badges et niveaux validés seront perdus sur cet appareil. Pense à copier ton code avant.", "Tout effacer", () => { ST = freshState(); save(); MAPGAME = null; render(); toast(I.check, "Progression remise à zéro", "Nouveau départ, nouvelle cave."); });
  });
  el.appendChild(sv);
  return el;
}
function applyTheme(){ if (ST.theme) document.documentElement.setAttribute("data-theme", ST.theme); else document.documentElement.removeAttribute("data-theme"); }

/* ---------------- démarrage ---------------- */
async function getJSON(u){ const r = await fetch(u); if (!r.ok) throw new Error(`${u} : ${r.status}`); return r.json(); }
async function boot(){
  $app.innerHTML = `<main class="wrap" style="text-align:center;padding-top:80px">${mascot("happy")}<p style="font-weight:800;color:var(--muted)">On débouche les bouteilles…</p></main>`;
  try {
    const keys = Object.keys(CONTENT); const vals = await Promise.all(keys.map(k => getJSON(CONTENT[k])));
    keys.forEach((k, i) => D[k] = vals[i]);
    await Promise.all(D.niveaux.niveaux.filter(n => n.contenu).map(async n => { LEVELS[n.id] = await getJSON(n.contenu); }));
  } catch(err) {
    $app.innerHTML = `<main class="wrap" style="padding-top:60px"><h2>Le contenu n'a pas pu être chargé</h2><p style="margin-top:8px">${esc(err.message)}. Recharge la page ; si le problème continue, vérifie que le dossier <code>content</code> est publié avec la page.</p></main>`;
    return;
  }
  // identifiants stables pour les questions (pile d'erreurs, défi)
  for (const [lid, L] of Object.entries(LEVELS)) {
    L.lecons.forEach(l => l.verif.forEach((q, i) => q.id = `${l.id}-v${i}`));
    L.jeux.forEach(g => (g.questions || []).forEach((q, i) => q.id = `${g.id}-${i}`));
    L.quiz.questions.forEach((q, i) => q.id = `quiz${lid}-${i}`);
  }
  GL_INDEX = Object.fromEntries(Object.keys(D.glossaire.termes).map(k => [k.toLowerCase(), k]));
  ST = loadState(); applyTheme();
  try { render(); }
  catch(err) {
    // dernier filet : on ne laisse jamais le joueur bloqué sur l'écran de chargement
    $app.innerHTML = `<main class="wrap" style="padding-top:60px"><h2>Ta sauvegarde n'a pas pu être lue</h2><p style="margin:8px 0 16px">Elle est peut-être abîmée. Tu peux repartir de zéro sur cet appareil.</p><button class="btn" data-reset>Repartir de zéro</button></main>`;
    $app.querySelector("[data-reset]").onclick = () => { ST = freshState(); save(); applyTheme(); render(); };
  }
}
boot();
</script>
</body>
</html>
